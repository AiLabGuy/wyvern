#
# Builds Wyvern and publishes a GitHub release when a tag like v0.2.0 is pushed.
#
# Always attached: <DMG_BASENAME>-<version>.dmg and its .sha256.
# Attached only when signing is configured (config/product.env pins a real UPDATE_PUBLIC_KEY and the
# MINISIGN_SECRET_KEY and MINISIGN_PASSWORD repo secrets are set):
#   <DMG_BASENAME>-<version>-b<build>.zip and latest.json, which the in-app updater reads from
#   https://github.com/<owner>/<repo>/releases/latest/download/latest.json
# Without signing the DMG is still built and attached, and latest.json is skipped with a warning.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Point the built-in update source at this repository
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          sed -i '' -e "s|GITHUB_OWNER|${owner}|g" -e "s|GITHUB_REPO|${repo}|g" config/product.env
      - name: Check tag and signing configuration
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          . scripts/load-product-env.sh
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$VERSION" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match VERSION=${VERSION} in config/product.env"
            exit 1
          fi
          signed=true
          if [[ -z "${UPDATE_PUBLIC_KEY:-}" || "$UPDATE_PUBLIC_KEY" == *PLACEHOLDER* ]]; then
            echo "::warning::UPDATE_PUBLIC_KEY is a placeholder. Publishing an unsigned DMG only; latest.json is skipped, so in-app updates will not see this release. Run scripts/new-release-key.sh to enable signing."
            signed=false
          fi
          if [[ -z "$MINISIGN_SECRET_KEY" || -z "$MINISIGN_PASSWORD" ]]; then
            echo "::warning::MINISIGN_SECRET_KEY or MINISIGN_PASSWORD secret is missing. Publishing an unsigned DMG only; latest.json is skipped."
            signed=false
          fi
          {
            echo "SIGNED=${signed}"
            echo "VERSION=${VERSION}"
            echo "DMG=build/${DMG_BASENAME}-${VERSION}.dmg"
            echo "APP_BUNDLE=${APP_BUNDLE}"
          } >> "$GITHUB_ENV"
      - name: Build app and disk image
        run: |
          bash scripts/build-app.sh
          bash scripts/make-dmg.sh
          test -f "$DMG"
          git archive --format=tar.gz --prefix="wyvern-${VERSION}/" -o "build/wyvern-${VERSION}-source.tar.gz" "$GITHUB_SHA"
          (cd build && shasum -a 256 "wyvern-${VERSION}-source.tar.gz" > "wyvern-${VERSION}-source.tar.gz.sha256")
      - name: Sign and package update
        if: env.SIGNED == 'true'
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          brew install minisign
          . scripts/load-product-env.sh
          dmg="${DMG_BASENAME}-${VERSION}.dmg"
          zip="${DMG_BASENAME}-${VERSION}-b${BUILD_NUMBER}.zip"
          keyfile="$RUNNER_TEMP/release.key"
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$keyfile"
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -l -s "$keyfile" -m "build/${dmg}.sha256" \
            -t "wyvern version=${VERSION} build=${BUILD_NUMBER} commit=${GITHUB_SHA} file=${dmg}"
          rm -f "$keyfile"
          minisign -V -P "$UPDATE_PUBLIC_KEY" -m "build/${dmg}.sha256" \
            || { echo "::error::signature does not verify against UPDATE_PUBLIC_KEY"; exit 1; }
          (cd build && zip -X -j "$zip" "$dmg" "${dmg}.sha256" "${dmg}.sha256.minisig")
          python3 - "$VERSION" "$BUILD_NUMBER" "$GITHUB_SHA" "$zip" > build/latest.json <<'PY'
          import json, sys
          version, build, commit, zip_name = sys.argv[1:]
          print(json.dumps({"format": 1, "version": version, "build": int(build),
                            "commit": commit, "zip_url": zip_name}, indent=2))
          PY
          echo "ZIP=build/$zip" >> "$GITHUB_ENV"
      - name: Write release notes
        run: |
          dmg_name="$(basename "$DMG")"
          {
            echo "## Install"
            echo
            echo "1. Download \`${dmg_name}\` below and open it."
            echo "2. Drag **${APP_BUNDLE}** onto the Applications folder."
            echo "3. First launch: this build is not signed with an Apple Developer ID and is not notarized, so"
            echo "   macOS Gatekeeper warns. On macOS 15 and later: try to open it once, dismiss the warning, then"
            echo "   System Settings > Privacy & Security > Open Anyway. On macOS 13 and 14: Control-click the app >"
            echo "   Open > Open. On any version you can instead run:"
            echo
            echo '   ```bash'
            echo "   xattr -dr com.apple.quarantine \"/Applications/${APP_BUNDLE}\""
            echo '   ```'
            echo
            echo "Requires macOS 13 or later. Check the download against \`${dmg_name}.sha256\` with"
            echo "\`shasum -a 256 -c ${dmg_name}.sha256\`. The source for this release is the tagged commit."
            echo
            if [[ "$SIGNED" == "true" ]]; then
              echo "This release is minisign-signed and published to the in-app updater (latest.json)."
            else
              echo "This release has no update signature, so the in-app updater does not offer it. Install it manually from the DMG."
            fi
            echo
            echo "All code in this project was generated by AI. See AI-DISCLOSURE.md."
          } > "$RUNNER_TEMP/notes.md"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=("$DMG" "${DMG}.sha256" "build/wyvern-${VERSION}-source.tar.gz" "build/wyvern-${VERSION}-source.tar.gz.sha256")
          if [[ "$SIGNED" == "true" ]]; then
            assets+=("$ZIP" build/latest.json)
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --title "Wyvern ${GITHUB_REF_NAME}" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
