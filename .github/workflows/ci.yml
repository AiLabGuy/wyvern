name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Compliance
        run: bash scripts/compliance-check.sh
      - name: Build
        run: swift build -c release
      - name: Unit tests
        run: swift test --filter WyvernCoreTests
      - name: App bundle
        run: bash scripts/build-app.sh
